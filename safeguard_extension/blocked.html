<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Blocked — SafeGuard AI</title>
  <style>
    body {
      background: #0F172A;
      color: #F8FAFC;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      background: #1E293B;
      border: 1px solid #334155;
      padding: 40px;
      border-radius: 16px;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; color: #EF4444; margin-bottom: 12px; }
    p { font-size: 14px; color: #94A3B8; margin-bottom: 24px; line-height: 1.5; }
    .domain-tag { background: #090D16; color: #F8FAFC; padding: 6px 12px; border-radius: 6px; font-weight: bold; border: 1px solid #334155; }
    .footer { font-size: 12px; color: #64748B; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>Website Blocked</h1>
    <p>Access to <span class="domain-tag" id="domainText">this site</span> has been restricted by SafeGuard AI Child Protection.</p>
    <p>An alert notification has been logged on the Parent Safety Dashboard.</p>
    <div class="footer">SafeGuard AI — Real-Time Browsing Protection</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const domain = params.get('domain');
    if (domain) {
      document.getElementById('domainText').textContent = domain;
    }
  </script>
</body>
</html>
